# Pakete fuer Windows, macOS und Linux, gebaut auf GitHub, weil eine Windows-EXE nur unter Windows und ein
# Mac-Programmpaket nur auf einem Mac entsteht (dasselbe Muster wie wtWin/wtMac in app4webtrees).
#   Windows: famrecon-windows.exe        Einzeldatei mit Symbol, Doppelklick startet die Oberflaeche
#   macOS:   famrecon-macos-arm64.zip    Programmpaket famrecon.app mit Symbol (entpacken, Rechtsklick > Oeffnen)
#   Linux:   famrecon-linux-x64          Einzeldatei; famrecon_<version>_amd64.deb mit Menueeintrag und Symbol
# Von Hand: Actions > Pakete > Run workflow, die Dateien liegen dann unter "Artifacts".
# Bei einem veroeffentlichten Release: an das Release haengen.
# Linux baut auf Ubuntu 22.04, damit die Einzeldatei auch auf aelteren Systemen (glibc 2.35) laeuft.
name: Pakete

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  paket:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            name: windows
          - runner: macos-latest
            name: macos
          - runner: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten
        run: python -m pip install --upgrade pip openpyxl pyinstaller pillow
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Paket bauen
        run: python -m PyInstaller werkzeuge/famrecon.spec --noconfirm
      - name: Windows-Datei
        if: runner.os == 'Windows'
        shell: bash
        run: mkdir -p out && cp dist/famrecon.exe out/famrecon-windows.exe
      - name: Mac-Programmpaket
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          ditto -c -k --keepParent dist/famrecon.app out/famrecon-macos-arm64.zip
      - name: Linux-Datei und Debian-Paket
        if: runner.os == 'Linux'
        run: |
          mkdir -p out && cp dist/famrecon out/famrecon-linux-x64
          bash werkzeuge/deb-bauen.sh dist/famrecon out
      - name: Ergebnis
        shell: bash
        run: ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: famrecon-${{ matrix.name }}
          path: out/*
      - name: An das Release haengen
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/* --clobber
