<h1>{{Projekte}}</h1>
<p class="meldung">$meldung</p>
<ul class="projekte">$projekte</ul>
<h2>{{Neues Projekt}}</h2>
<form method="post" action="/neu" enctype="multipart/form-data" class="karte" onsubmit="const b=this.querySelector('button'); b.disabled=true; b.textContent='⏳ ' + b.textContent">
  <label>{{Name}} <input name="name" required pattern="[\w\-]+" placeholder="mein-ort"></label>
  <label>{{Tabellen (xlsx, eine Mappe mit Blättern oder mehrere Dateien)}} <input type="file" name="dateien" multiple accept=".xlsx,.xlsm,.csv,.tsv"></label>
  <button>{{anlegen}}</button>
</form>
<p class="hilfe">{{Ein Projekt ist ein Ordner unter}} <code>$daten</code>. {{Der Weg: Tabellen laden → Zuordnung durchsehen → bauen → Prüfliste → GEDCOM.}} $hilfe</p>
<form method="post" action="/beispiele" onsubmit="const b=this.querySelector('button'); b.disabled=true; b.textContent='⏳ ' + b.textContent"><button class="leise">{{Beispielprojekt anlegen (erfundener Stammbaum, 492 Personen)}}</button></form>
