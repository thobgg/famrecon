<h1>$projekt</h1>
<p class="meldung">$meldung</p>
<table class="schritte">$schritte</table>
<div class="aktionen">
  <form method="post" action="/p/$projekt/hochladen" enctype="multipart/form-data"><input type="file" name="dateien" multiple accept=".xlsx,.xlsm,.csv,.tsv"><button>{{Tabellen hochladen}}</button></form>
  <a class="knopf" href="/p/$projekt/zuordnung">{{Zuordnung durchsehen}}</a>
  <form method="post" action="/p/$projekt/bauen"><button>{{bauen und verknüpfen}}</button></form>
  <a class="knopf" href="/p/$projekt/personen">{{Personen}}</a>
  <a class="knopf" href="/p/$projekt/familien">{{Familien}}</a>
  <a class="knopf" href="/p/$projekt/pruefliste">{{Prüfliste}}</a>
  <a class="knopf" href="/p/$projekt/gedcom">{{GEDCOM schreiben und prüfen}}</a>
  $ged_link
  <form method="post" action="/p/$projekt/loeschen" onsubmit="return confirm('{{Projekt samt Tabellen löschen?}}')"><button class="leise">{{Projekt löschen}}</button></form>
</div>
