<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$titel · famrecon</title>
<link rel="stylesheet" href="/static/stil.css">
<link rel="icon" href="/static/symbol.png">
</head>
<body>
<header>
  <a class="marke" href="/"><img src="/static/symbol.png" alt="" class="symbol">famrecon</a>
  <nav>$projekt_nav</nav>
  <div class="rechts">
    <a class="hilfe-knopf" href="$hilfe_ziel" title="{{Hilfe zu dieser Seite}}">? {{Hilfe}}</a>
    <form method="post" action="/beenden" onsubmit="return rueckfrage(this, '{{famrecon beenden? Alle Daten sind gespeichert.}}')"><button class="leise klein">{{Beenden}}</button></form>
  </div>
</header>
<main>
$inhalt
</main>
<footer>{{famrecon · Familien aus Tauf-, Ehe- und Sterberegistern · lokal, nichts verlässt diesen Rechner}}</footer>
<dialog id="rueckfrage"><form method="dialog"><p id="rueckfrage-text"></p><p class="knoepfe"><button value="ja">{{Ja}}</button> <button value="nein" class="leise">{{Nein}}</button></p></form></dialog>
<script>
// Eigene Rueckfrage statt confirm(): der Browser-Dialog zeigt im App-Fenster die Adresse 127.0.0.1 an.
function rueckfrage(form, text) {
  const d = document.getElementById('rueckfrage');
  document.getElementById('rueckfrage-text').textContent = text;
  d.onclose = () => {
    if (d.returnValue !== 'ja') return;
    if (form.getAttribute('action') !== '/beenden') { form.submit(); return; }
    // Beenden: Seite sofort leeren und im Hintergrund abschicken, damit beim Schliessen des Fensters nichts mehr aufflackert.
    document.body.innerHTML = '';
    document.body.style.background = '#fff';
    fetch('/beenden', { method: 'POST' }).finally(() => {
      setTimeout(() => { document.body.innerHTML = '<p style="padding:2rem;color:#666">' + '{{famrecon ist beendet. Dieses Fenster kann geschlossen werden.}}' + '</p>'; }, 2500);
    });
  };
  d.showModal();
  return false;
}
</script>
</body>
</html>
